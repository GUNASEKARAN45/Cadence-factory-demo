<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .success { color: #2ECC71; font-weight: bold; }
        .error { color: #E74C3C; font-weight: bold; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 FoodHub Test Suite</h1>
    <div id="test-results"></div>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/search.js"></script>
    <script>
        const results = document.getElementById('test-results');
        
        function addTest(name, passed, details) {
            const div = document.createElement('div');
            div.className = 'test-section';
            div.innerHTML = `
                <h3>${passed ? '✅' : '❌'} ${name}</h3>
                <p class="${passed ? 'success' : 'error'}">${passed ? 'PASSED' : 'FAILED'}</p>
                ${details ? `<pre>${details}</pre>` : ''}
            `;
            results.appendChild(div);
        }

        // Test 1: Data module loaded
        try {
            addTest(
                'Data Module',
                categories.length > 0 && restaurants.length > 0 && dishes.length > 0,
                `Categories: ${categories.length}\nRestaurants: ${restaurants.length}\nDishes: ${dishes.length}\nOffers: ${offers.length}\nReviews: ${reviews.length}`
            );
        } catch (e) {
            addTest('Data Module', false, e.message);
        }

        // Test 2: Cart functionality
        try {
            cart.clearCart();
            const testDish = dishes[0];
            cart.addItem(testDish);
            const totalItems = cart.getTotalItems();
            const hasItem = cart.hasItem(testDish.id);
            cart.clearCart();
            addTest(
                'Cart Functionality',
                totalItems === 1 && hasItem,
                `Added item, total: ${totalItems}\nHas item: ${hasItem}\nCart cleared successfully`
            );
        } catch (e) {
            addTest('Cart Functionality', false, e.message);
        }

        // Test 3: Search and filter
        try {
            const pizzaDishes = filterByCategory(dishes, 'Pizza');
            const budgetDishes = filterByPriceRange(dishes, 'budget');
            const searchResults = filterByText(dishes, 'burger');
            addTest(
                'Search & Filter',
                pizzaDishes.length > 0 && budgetDishes.length > 0,
                `Pizza dishes: ${pizzaDishes.length}\nBudget dishes: ${budgetDishes.length}\nSearch 'burger': ${searchResults.length}`
            );
        } catch (e) {
            addTest('Search & Filter', false, e.message);
        }

        // Test 4: Combined filters
        try {
            const filtered = applyFilters(dishes, {
                category: 'Pizza',
                priceRange: 'medium'
            });
            addTest(
                'Combined Filters',
                filtered.length >= 0,
                `Pizza in medium range: ${filtered.length} dishes`
            );
        } catch (e) {
            addTest('Combined Filters', false, e.message);
        }

        // Test 5: Session storage
        try {
            cart.clearCart();
            cart.addItem(dishes[0]);
            const beforeReload = cart.getTotalItems();
            
            // Simulate reload by creating new cart instance
            const newCart = new Cart();
            const afterReload = newCart.getTotalItems();
            
            cart.clearCart();
            addTest(
                'Session Storage',
                beforeReload === 1 && afterReload === 1,
                `Before: ${beforeReload} items\nAfter reload: ${afterReload} items\nPersistence working!`
            );
        } catch (e) {
            addTest('Session Storage', false, e.message);
        }

        // Test 6: Price calculations
        try {
            cart.clearCart();
            cart.addItem(dishes[0], 2);
            const subtotal = cart.getSubtotal();
            const tax = cart.getTax();
            const delivery = cart.getDeliveryFee();
            const total = cart.getTotalPrice();
            cart.clearCart();
            addTest(
                'Price Calculations',
                subtotal > 0 && tax > 0 && total > subtotal,
                `Subtotal: $${subtotal.toFixed(2)}\nTax (8%): $${tax.toFixed(2)}\nDelivery: $${delivery.toFixed(2)}\nTotal: $${total.toFixed(2)}`
            );
        } catch (e) {
            addTest('Price Calculations', false, e.message);
        }

        console.log('✅ All tests completed!');
    </script>
</body>
</html>
